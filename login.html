<body class="login-body"><a class="back-home" href="index.html">← Kembali ke portal</a><main class="login-card"><div class="brand-mark large">PS</div><span class="eyebrow">AREA PENGELOLA</span><h1>Login Admin</h1><p>Masuk untuk mengelola berita dan pengumuman sekolah.</p><form id="login-form"><label>Email<input type="email" id="email" required autocomplete="username" placeholder="admin@sekolah.sch.id"></label><label>Password<input type="password" id="password" required autocomplete="current-password" placeholder="Password"></label><button class="btn btn-primary full" type="submit">Masuk ke Dashboard</button><p id="login-message" class="form-message" role="status"></p></form><small>Akun dibuat melalui Supabase Authentication. Akses admin harus ditambahkan pada tabel profiles.</small></main><script type="module" src="js/login.js"></script></body></html>
